# ============================================================
# Venta Max IA — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:  cp .env.example .env  →  rellenar  →  docker compose up -d --build
# ============================================================
services:
  app:
    build:
      context: .
      target: app-runtime
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    cpus: 0.50
    mem_limit: 256m
    env_file:
      - .env
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL requerido}
      APP_DATABASE_URL: postgresql://venta_app:${VENTA_APP_PASSWORD:?VENTA_APP_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requerido}
      AUTH_DATABASE_URL: postgresql://venta_auth:${VENTA_AUTH_PASSWORD:?VENTA_AUTH_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requerido}
      INGRESS_DATABASE_URL: postgresql://venta_ingress:${VENTA_INGRESS_PASSWORD:?VENTA_INGRESS_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requerido}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET requerido}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requerido}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-vocero_verify_token}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      PROVIDER_API_TOKEN: ${PROVIDER_API_TOKEN:-${OPENROUTER_API_TOKEN:-}}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-${OPENROUTER_API_KEY:-}}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-${OPENROUTER_BASE_URL:-https://api.deepseek.com}}
      PROVIDER_MODEL: ${PROVIDER_MODEL:-${OPENROUTER_MODEL:-deepseek-chat}}
      PROVIDER_FALLBACK_API_KEY: ${PROVIDER_FALLBACK_API_KEY:-${GEMINI_API_KEY:-}}
      PROVIDER_FALLBACK_BASE_URL: ${PROVIDER_FALLBACK_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      PROVIDER_FALLBACK_MODEL: ${PROVIDER_FALLBACK_MODEL:-gemini-2.0-flash}
      PROVIDER_EMBEDDING_API_KEY: ${PROVIDER_EMBEDDING_API_KEY:-${GEMINI_API_KEY:-}}
      PROVIDER_EMBEDDING_BASE_URL: ${PROVIDER_EMBEDDING_BASE_URL:-}
      PROVIDER_EMBEDDING_MODEL: ${PROVIDER_EMBEDDING_MODEL:-text-embedding-004}
      PROVIDER_JUDGE_MODEL: ${PROVIDER_JUDGE_MODEL:-${OPENROUTER_JUDGE_MODEL:-}}
      PROVIDER_JUDGE_FALLBACK_MODEL: ${PROVIDER_JUDGE_FALLBACK_MODEL:-${OPENROUTER_JUDGE_FALLBACK_MODEL:-}}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-1500}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      WA_MOCK_ENABLED: ${WA_MOCK_ENABLED:-false}
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - vocero_net
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  migrator:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      MIGRATOR_DATABASE_URL: postgresql://venta_migrator:${VENTA_MIGRATOR_PASSWORD:?VENTA_MIGRATOR_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requerido}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vocero_net

  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    cpus: 1.50
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      VENTA_MIGRATOR_PASSWORD: ${VENTA_MIGRATOR_PASSWORD:?VENTA_MIGRATOR_PASSWORD requerido}
      VENTA_APP_PASSWORD: ${VENTA_APP_PASSWORD:?VENTA_APP_PASSWORD requerido}
      VENTA_AUTH_PASSWORD: ${VENTA_AUTH_PASSWORD:?VENTA_AUTH_PASSWORD requerido}
      VENTA_INGRESS_PASSWORD: ${VENTA_INGRESS_PASSWORD:?VENTA_INGRESS_PASSWORD requerido}
      VENTA_BACKUP_PASSWORD: ${VENTA_BACKUP_PASSWORD:?VENTA_BACKUP_PASSWORD requerido}
      VENTA_RESTORE_PASSWORD: ${VENTA_RESTORE_PASSWORD:?VENTA_RESTORE_PASSWORD requerido}
    volumes:
      - vocero_pg:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - vocero_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    cpus: 0.20
    mem_limit: 64m
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:7080:7080"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      vocero_net:
        aliases:
          - bot
          - nginx
          - localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:2026.1.2
    container_name: cloudflare_tunnel
    profiles: ["own-tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks:
      - vocero_net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  vocero_pg:
  vocero_caddy_data:
  vocero_caddy_config:

networks:
  vocero_net:
    driver: bridge
