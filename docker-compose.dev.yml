# Postgres local para desarrollo. Uso: docker compose -f docker-compose.dev.yml up -d
# `name` propio: evita colisionar con el proyecto del docker-compose.yml (Ruta B).
name: vocero-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      VENTA_MIGRATOR_PASSWORD: ${VENTA_MIGRATOR_PASSWORD:?VENTA_MIGRATOR_PASSWORD requerido}
      VENTA_APP_PASSWORD: ${VENTA_APP_PASSWORD:?VENTA_APP_PASSWORD requerido}
      VENTA_AUTH_PASSWORD: ${VENTA_AUTH_PASSWORD:?VENTA_AUTH_PASSWORD requerido}
      VENTA_INGRESS_PASSWORD: ${VENTA_INGRESS_PASSWORD:?VENTA_INGRESS_PASSWORD requerido}
      VENTA_BACKUP_PASSWORD: ${VENTA_BACKUP_PASSWORD:?VENTA_BACKUP_PASSWORD requerido}
      VENTA_RESTORE_PASSWORD: ${VENTA_RESTORE_PASSWORD:?VENTA_RESTORE_PASSWORD requerido}
    ports:
      # Las pruebas locales usan 127.0.0.1:5432; no exponer PostgreSQL a la LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - vocero_dev_pg:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vocero_dev_net

  dev_proxy:
    image: caddy:2-alpine
    container_name: vocero_dev_bot_proxy
    restart: unless-stopped
    command: caddy reverse-proxy --from :7080 --to host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      vocero_dev_net:
        aliases:
          - bot
          - nginx
          - localhost

  tunnel:
    image: cloudflare/cloudflared:2026.1.2
    container_name: vocero_dev_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - dev_proxy
    networks:
      - vocero_dev_net

volumes:
  vocero_dev_pg:

networks:
  vocero_dev_net:
    driver: bridge
